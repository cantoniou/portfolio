document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

e:clamp(40px,5.4vw,76px);\"><span data-count=\"{{ k.n }}\" data-suffix=\"{{ k.suffix }}\" data-comma=\"{{ k.comma }}\">0{{ k.suffix }}<\/span><\/div>\n            <div style=\"margin-top:12px; font-size:clamp(14px,1.3vw,17px); color:#2c2b31; line-height:1.25;\">{{ k.label }}<\/div>\n            <sc-if value=\"{{ k.note }}\" hint-placeholder-val=\"x\"><div style=\"margin-top:5px; font-family:'Space Mono',monospace; font-size:11px; color:#8a877f;\">{{ k.note }}<\/div><\/sc-if>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ===== THREE GEARS ===== -->\n  <section style=\"padding:clamp(60px,10vh,120px) clamp(20px,5vw,56px); border-top:1px solid rgba(22,22,29,0.14);\">\n    <div style=\"max-width:1280px; margin:0 auto;\">\n      <div data-reveal=\"\" data-accent-fg=\"\" style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:#3070B3; margin-bottom:clamp(14px,3vh,20px);\">/ 01 — Three decades, three gears<\/div>\n      <p data-reveal=\"\" style=\"font-size:clamp(16px,1.6vw,22px); max-width:680px; line-height:1.45; color:#57544d; margin-bottom:clamp(34px,6vh,60px);\">Output rose with each career stage — roughly 4, then 18, then 33 works a year.<\/p>\n      <!-- stepped bars -->\n      <div data-reveal=\"\" style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(12px,2vw,28px); align-items:end; height:clamp(170px,26vh,250px); margin-bottom:clamp(26px,4vh,40px); border-bottom:2px solid #16161d; padding-bottom:0;\">\n        <sc-for list=\"{{ eras }}\" as=\"e\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex; flex-direction:column; justify-content:flex-end; height:100%;\">\n            <div style=\"font-family:'Space Mono',monospace; font-size:clamp(12px,1.3vw,15px); font-weight:700; margin-bottom:8px;\"><span data-count=\"{{ e.works }}\" data-suffix=\"\">0<\/span> works<\/div>\n            <div data-barv=\"\" data-pct=\"{{ e.pct }}\" style=\"width:100%; height:0; background:{{ e.color }}; transition:height 1.1s cubic-bezier(.2,.7,.2,1);\"><\/div>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n      <div style=\"display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(12px,2vw,28px);\">\n        <sc-for list=\"{{ eras }}\" as=\"e\" hint-placeholder-count=\"3\">\n          <div data-reveal=\"\">\n            <div style=\"font-size:clamp(16px,1.7vw,21px); font-weight:600; letter-spacing:-0.01em;\">{{ e.place }}<\/div>\n            <div style=\"font-family:'Space Mono',monospace; font-size:12px; color:#8a877f; margin:6px 0 10px;\">{{ e.years }}<\/div>\n            <div style=\"display:flex; align-items:baseline; gap:6px;\"><span style=\"font-size:clamp(26px,3.4vw,44px); font-weight:600; letter-spacing:-0.02em;\" data-count=\"{{ e.rate }}\" data-suffix=\"\">0<\/span><span style=\"font-family:'Space Mono',monospace; font-size:13px; color:#57544d;\">works / year<\/span><\/div>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- ===== THREE DATABASES ===== -->\n  <section style=\"padding:clamp(60px,10vh,120px) clamp(20px,5vw,56px); background:#16161d; color:#f5f3ee;\">\n    <div style=\"max-width:1280px; margin:0 auto;\">\n      <div data-reveal=\"\" data-accent-fg=\"\" style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.16em; text-transform:uppercase; color:#3070B3; margin-bottom:clamp(30px,5vh,52px);\">/ 02 — The same career, three databases<\/div>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr)); gap:clamp(30px,4vw,56px);\">\n        <sc-for list=\"{{ databases }}\" as=\"d\" hint-placeholder-count=\"3\">\n          <div data-reveal=\"\">\n            <div style=\"font-size:clamp(17px,1.8vw,24px); font-weight:600; margin-bottom:clamp(18px,3vh,26px);\">{{ d.label }}<\/div>\n            <div style=\"display:flex; flex-direction:column; gap:18px;\">\n              <sc-for list=\"{{ d.  border-top:2px solid #16161d; padding-top:clamp(22px,3.5vh,32px); margin-bottom:clamp(48px,8vh,84px);\">\n        <div style=\"display:grid; grid-template-columns:clamp(110px,15vw,190px) minmax(0,1fr); gap:clamp(18px,3vw,44px);\">\n          <div data-reveal=\"\" style=\"font-family:'Space Mono',monospace; font-size:13px; letter-spacing:0.14em; text-transform:uppercase; color:#3070B3;\">01<br><span style=\"color:#16161d;\">Funding<\/span><\/div>\n          <div>\n            <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr)); gap:clamp(20px,3vw,44px); margin-bottom:clamp(32px,5vh,52px);\">\n              <sc-for list=\"{{ fundStats }}\" as=\"s\" hint-placeholder-count=\"3\">\n                <div data-reveal=\"\">\n                  <div style=\"font-size:clamp(40px,5.4vw,78px); font-weight:600; letter-spacing:-0.03em; line-height:0.82; color:{{ s.color }};\">{{ s.v }}<\/div>\n                  <div style=\"margin-top:12px; font-size:clamp(13px,1.3vw,16px); color:#2c2b31; line-height:1.35;\">{{ s.label }}<\/div>\n                <\/div>\n              <\/sc-for>\n            <\/div>\n            <div data-reveal=\"\" style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#8a877f; margin-bottom:16px;\">Flagship H2020 consortia · total budget<\/div>\n            <div style=\"display:flex; flex-direction:column; gap:14px; margin-bottom:clamp(30px,5vh,46px);\">\n              <sc-for list=\"{{ consortia }}\" as=\"c\" hint-placeholder-count=\"3\">\n                <div data-reveal=\"\">\n                  <div style=\"display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px;\">\n                    <span style=\"font-size:clamp(15px,1.5vw,20px); font-weight:500;\">{{ c.name }}<\/span>\n                    <span style=\"font-family:'Space Mono',monospace; font-weight:700; font-size:clamp(15px,1.5vw,20px); color:#3070B3;\">{{ c.budget }}<\/span>\n                  <\/div>\n                  <div style=\"position:relative; height:11px; background:rgba(22,22,29,0.08);\">\n                    <div data-bar-fill=\"\" data-pct=\"{{ c.pct }}\" style=\"position:absolute; inset:0 auto 0 0; width:0; height:100%; background:#3070B3; transition:width 1s cubic-bezier(.2,.7,.2,1);\"><\/div>\n                  <\/div>\n                <\/div>\n              <\/sc-for>\n            <\/div>\n            <div data-reveal=\"\" style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#8a877f; margin-bottom:14px;\">Selected funded projects · EU and national<\/div>\n            <div data-reveal=\"\" style=\"display:flex; flex-wrap:wrap; gap:9px;\">\n              <sc-for list=\"{{ euProjects }}\" as=\"p\" hint-placeholder-count=\"9\">\n                <span style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.03em; padding:7px 13px; border:1px solid rgba(22,22,29,0.22); color:#16161d;\">{{ p }}<\/span>\n              <\/sc-for>\n              <sc-for list=\"{{ nationalProjects }}\" as=\"p\" hint-placeholder-count=\"5\">\n                <span style=\"font-family:'Space Mono',monospace; font-size:12px; letter-spacing:0.03em; padding:7px 13px; border:1px solid rgba(22,22,29,0.22); color:#8a877f;\">{{ p }}<\/span>\n              <\/sc-for>\n            <\/div>\n          <\/div>\n        <\/div>\n      <\/div>\n\n      <!-- PILLARS 02 + 03 -->\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr)); gap:clamp(36px,5vw,72px);\">\n        <div data-reveal=\"\" style=\"border-top:2px solid #16161d; padding-top:clamp(22px,3.5vh,32px);\">\n          <div style=\"font-family:'Space Mono',monospace; font-size:13px; letter-spacing:0.14em; text-transform:uppercase; color:#3070B3; margin-bottom:clamp(20px,3.5vh,30px);\">02 <span style=\"color:#16161d;\">· Editorial &amp; review<\/span><\/div>\n          <div style=\"display:flex; flex-direction:column;\">\n            <sc-for list=\"{{ editorial }}\" as=\"e\" hint-placeholder-count=\"4\">\n              <div style=\"display:grid; grid-template-columns:minmax(0,1fr); gap:6px; padding:16px 0; border-bottom:1px solid rgba(22,22,29,0.12);\">\n                <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#8a877f;\">{{ e.k }}<\/div>\n                <div style=\"font-size:clamp(15px,1.45vw,19px); line-height:1.4; color:#201f26;\">{{ e.v }}<\/div>\n              <\/div>\n            <\/sc-for>\n          <\/div>\n        <\/div>\n        <div data-reveal=\"\" style=\"border-top:2px solid #16161d; padding-top:clamp(22px,3.5vh,32px);\">\n          <div style=\"font-family:'Space Mono',monospace; font-size:13px; letter-spacing:0.14em; text-transform:uppercase; color:#3070B3; margin-bottom:clamp(20px,3.5vh,30px);\">03 <span style=\"color:#16161d;\">· Supervision &amp; teaching<\/span><\/div>\n          <div style=\"display:flex; flex-direction:column;\">\n            <sc-for list=\"{{ supervision }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"display:grid; grid-template-columns:minmax(0,1fr); gap:6px; padding:16px 0; border-bottom:1px solid rgba(22,22,29,0.12);\">\n                <div style=\"font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:#8a877f;\">{{ s.k }}<\/div>\n                <div style=\"font-size:clamp(15px,1.45vw,19px); line-height:1.4; color:#201f26;\">{{ s.v }}<\/div>\n              <\/div>\n            <\/sc-for>\n          <\/div>\n        <\/div>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <!-- footer -->\n  <footer style=\"padding:clamp(44px,8vh,80px) clamp(20px,5vw,56px); background:#16161d; color:#8a877f;\">\n    <div style=\"max-width:1280px; margin:0 auto;\">\n      <p style=\"font-size:clamp(13px,1.3vw,16px); line-height:1.6; max-width:860px; color:#b9b6ae;\">Charts are drawn from the OpenAlex record for author A5001459918 (ORCID 0000-0003-0203-9542), extracted 3 October 2026; headline Scopus and Google Scholar figures are quoted from the chair's own profile. The three databases differ because they index different kinds of work.<\/p>\n      <div style=\"display:flex; flex-wrap:wrap; justify-content:space-between; gap:12px; margin-top:clamp(28px,4vh,44px); padding-top:20px; border-top:1px solid rgba(245,243,238,0.14); font-family:'Space Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase;\">\n        <span>Univ.-Prof. Dr. Constantinos Antoniou · TUM<\/span>\n        <span>Bibliometric portrait<\/span>\n      <\/div>\n    <\/div>\n  <\/footer>\n\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:1500},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#3070B3&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#3070B3&quot;,&quot;#1f6aa8&quot;,&quot;#2d4a3e&quot;,&quot;#16161d&quot;]},&quot;motion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const red = '#3070B3';\n    const blue = '#2a4a73';\n    const gold = '#b5121b';\n    const green = 'oklch(0.56 0.11 155)';\n\n    // ---- publication-type donut (r=52) over total 533 ----\n    const C = 2 * Math.PI * 52;\n    const pdTotal = 533;\n    const pdSeg = (v, color, start) => ({ color, dash: (v / pdTotal * C).toFixed(2) + ' ' + C.toFixed(2), off: (-(start / pdTotal * C)).toFixed(2) });\n\n    const h = React.createElement;\n    const NAVY = '#0b0b10';\n    // ===== research-topic network =====\n    const W = 1100, H = 660, cx = 550, cy = 330;\n    const topics = [\n      { id: 't0', label: 'Traffic Simulation',            r: 40, ang: -90, dist: 250, color: red },\n      { id: 't1', label: 'Dynamic Traffic Assignment',    r: 38, ang: -50, dist: 258, color: red },\n      { id: 't2', label: 'Intelligent Transport Systems', r: 38, ang: -10, dist: 262, color: blue },\n      { id: 't3', label: 'Calibration & Estimation',      r: 32, ang: 30,  dist: 258, color: blue },\n      { id: 't4', label: 'Travel Demand',                 r: 30, ang: 70,  dist: 250, color: gold },\n      { id: 't5', label: 'Road Safety',                   r: 32, ang: 110, dist: 250, color: gold },\n      { id: 't6', label: 'Driver Behaviour',              r: 30, ang: 150, dist: 255, color: green },\n      { id: 't7', label: 'Freight & Logistics',           r: 30, ang: 190, dist: 262, color: green },\n      { id: 't8', label: 'Machine Learning',              r: 30, ang: 230, dist: 255, color: '#c9c6bd' },\n    ].map(t => {\n      const a = t.ang * Math.PI / 180;\n      return { ...t, x: cx + Math.cos(a) * t.dist, y: cy + Math.sin(a) * t.dist * 0.72 };\n    });\n    const hub = { id: 'hub', label: 'Transportation Systems', x: cx, y: cy, r: 64, color: red };\n    const nodeById = {}; topics.forEach(t => nodeById[t.id] = t); nodeById.hub = hub;\n    const edges = [\n      ['hub','t0'],['hub','t1'],['hub','t2'],['hub','t3'],['hub','t4'],\n      ['hub','t5'],['hub','t6'],['hub','t7'],['hub','t8'],\n      ['t0','t1'],['t1','t3'],['t3','t8'],['t2','t8'],['t0','t3'],\n      ['t4','t2'],['t5','t6'],['t6','t1'],['t7','t4'],['t2','t1'],\n    ];\n    const adj = {};\n    edges.forEach(([a,b]) => { (adj[a]=adj[a]||new Set()).add(b); (adj[b]=adj[b]||new Set()).add(a); });\n    const edgeEls = edges.map(([a,b], i) => {\n      const p = nodeById[a], q = nodeById[b];\n      return h('line', { key: 'e' + i, 'data-edge': a + '|' + b, x1: p.x, y1: p.y, x2: q.x, y2: q.y,\n        stroke: 'rgba(245,243,238,0.16)', strokeWidth: 1.4, strokeLinecap: 'round',\n        style: { transition: 'stroke .3s, stroke-width .3s' } });\n    });\n    const wrap = (str, max) => str.split(' ').reduce((ls, w) => {\n      if (!ls.length) return [w];\n      const last = ls[ls.length - 1];\n      if ((last + ' ' + w).length <= max) { ls[ls.length - 1] = last + ' ' + w; } else ls.push(w);\n      return ls;\n    }, []);\n    const mkHub = (n) => h('g', { key: n.id, 'data-node': n.id, 'data-bx': n.x, 'data-by': n.y, style: { willChange: 'transform' } }, [\n      h('circle', { key: 'halo', cx: n.x, cy: n.y, r: n.r + 12, fill: n.color, opacity: 0.28, filter: 'url(#netsoft)', style: { pointerEvents: 'none' } }),\n      h('circle', { key: 'c', 'data-circle': '1', cx: n.x, cy: n.y, r: n.r, fill: n.color, style: { transition: 'transform .35s cubic-bezier(.2,.7,.2,1)', transformOrigin: n.x + 'px ' + n.y + 'px' } }),\n      h('circle', { key: 'ring', cx: n.x, cy: n.y, r: n.r + 5, fill: 'none', stroke: n.color, strokeWidth: 1, opacity: 0.4, style: { pointerEvents: 'none' } }),\n      h('text', { key: 't', x: n.x, y: n.y, textAnchor: 'middle', dominantBaseline: 'middle', fill: '#f5f3ee', style: { fontFamily: \"'Space Grotesk',sans-serif\", fontWeight: 600, fontSize: 19, letterSpacing: '-0.01em', pointerEvents: 'none' } },\n        wrap(n.label, 13).map((line, li, arr) => h('tspan', { key: li, x: n.x, dy: li === 0 ? -(arr.length - 1) * 11 : 22 }, line))),\n    ]);\n    const mkNode = (n) => {\n      const dx = n.x - cx, dy = n.y - cy;\n      const len = Math.hypot(dx, dy) || 1;\n      const ux = dx / len, uy = dy / len;\n      const lx = n.x + ux * (n.r + 13);\n      const ly = n.y + uy * (n.r + 13);\n      const anchor = ux > 0.25 ? 'start' : ux < -0.25 ? 'end' : 'middle';\n      const lines = wrap(n.label, 16);\n      const lineH = 17;\n      const y0 = ly - (lines.length - 1) * lineH / 2;\n      return h('g', { key: n.id, 'data-node': n.id, 'data-bx': n.x, 'data-by': n.y, style: { cursor: 'pointer', willChange: 'transform' } }, [\n        h('circle', { key: 'halo', 'data-halo': '1', cx: n.x, cy: n.y, r: n.r + 8, fill: n.color, opacity: 0, filter: 'url(#netsoft)', style: { transition: 'opacity .3s', pointerEvents: 'none' } }),\n        h('circle', { key: 'c', 'data-circle': '1', cx: n.x, cy: n.y, r: n.r, fill: NAVY, stroke: n.color, strokeWidth: 2.5, style: { transition: 'transform .35s cubic-bezier(.2,.7,.2,1)', transformOrigin: n.x + 'px ' + n.y + 'px' } }),\n        h('circle', { key: 'dot', cx: n.x, cy: n.y, r: 3.5, fill: n.color, style: { pointerEvents: 'none' } }),\n        h('text', { key: 't', 'data-label': '1', x: lx, y: y0, textAnchor: anchor, dominantBaseline: 'middle', fill: '#e9e6de', style: { fontFamily: \"'Space Grotesk',sans-serif\", fontWeight: 500, fontSize: 14, letterSpacing: '-0.01em', pointerEvents: 'none', transition: 'fill .25s' } },\n          lines.map((line, li) => h('tspan', { key: li, x: lx, dy: li === 0 ? 0 : lineH }, line))),\n      ]);\n    };\n    const nodeEls = [mkHub(hub), ...topics.map(t => mkNode(t))];\n    const ringEls = [140, 230, 320].map((rr, i) => h('ellipse', { key: 'r' + i, cx: cx, cy: cy, rx: rr, ry: rr * 0.72, fill: 'none', stroke: 'rgba(245,243,238,0.055)', strokeWidth: 1 }));\n    const defs = h('defs', null, h('filter', { id: 'netsoft', x: '-60%', y: '-60%', width: '220%', height: '220%' }, h('feGaussianBlur', { in: 'SourceGraphic', stdDeviation: 7 })));\n    const networkEl = h('div', { style: { width: '100%' } },\n      h('svg', { viewBox: '0 0 ' + W + ' ' + H, 'data-net-svg': '1', style: { width: '100%', height: 'auto', display: 'block', overflow: 'visible' } },\n        [defs, h('g', { key: 'rings' }, ringEls), h('g', { key: 'edges', 'data-edges': '1' }, edgeEls), h('g', { key: 'nodes', 'data-nodes': '1' }, nodeEls)]));\n\n    // keyword cloud sizing\n    const kw = (label, n, color) => ({ label, n, color, size: Math.round(16 + (n - 12) / (57 - 12) * (46 - 16)) });\n    const kRed = '#5aa6e6', kGold = '#b5121b', kBlue = '#8aa0bf', kGrey = '#9b978d';\n\n    return {\n      network: networkEl,\n      _adj: adj,\n      kpis: [\n        { n: 533, suffix: '', comma: '', label: 'Indexed works', note: 'since 1997' },\n        { n: 11785, suffix: '', comma: '1', label: 'Citations', note: 'OpenAlex · 17k+ on Scholar' },\n        { n: 55, suffix: '', comma: '', label: 'h-index', note: '69 on Google Scholar' },\n        { n: 550, suffix: '+', comma: '', label: 'Distinct co-authors' },\n      ],\n      eras: [\n        { place: 'MIT & industry', years: '1997 – 2008', works: 45, rate: 4, pct: 12.5, color: blue },\n        { place: 'NTUA faculty', years: '2009 – 2015', works: 127, rate: 18, pct: 35.2, color: gold },\n        { place: 'TUM chair', years: '2016 – 2026', works: 361, rate: 33, pct: 100, color: red },\n      ],\n      databases: [\n        { label: 'Works indexed', rows: [\n          { src: 'OpenAlex', n: 533, suffix: '', comma: '', pct: 100, color: red },\n          { src: 'Scopus', n: 380, suffix: '+', comma: '', pct: 71.3, color: blue },\n          { src: 'Google Scholar', n: 500, suffix: '+', comma: '', pct: 93.8, color: gold },\n        ]},\n        { label: 'Citations', rows: [\n          { src: 'OpenAlex', n: 11785, suffix: '', comma: '1', pct: 69.3, color: red },\n          { src: 'Scopus', n: 10000, suffix: '+', comma: '1', pct: 58.8, color: blue },\n          { src: 'Google Scholar', n: 17000, suffix: '+', comma: '1', pct: 100, color: gold },\n        ]},\n        { label: 'h-index', rows: [\n          { src: 'OpenAlex', n: 55, suffix: '', comma: '', pct: 79.7, color: red },\n          { src: 'Scopus', n: 53, suffix: '', comma: '', pct: 76.8, color: blue },\n          { src: 'Google Scholar', n: 69, suffix: '', comma: '', pct: 100, color: gold },\n        ]},\n      ],\n      funnel: [\n        { label: 'All indexed works', n: 533, pct: 100, color: '#16161d' },\n        { label: 'Cited at least once', n: 407, pct: 76.4, color: red },\n        { label: 'Cited 10+ times', n: 224, pct: 42, color: gold },\n        { label: 'Cited 100+ times', n: 24, pct: 4.5, color: green },\n      ],\n      topCited: [\n        { rank: '01', title: 'Shared : 52.9, color: gold },\n        { country: 'United States', n: 74, pct: 24, color: blue },\n        { country: 'United Kingdom', n: 50, pct: 16.2, color: green },\n        { country: 'China', n: 29, pct: 9.4, color: '#16161d' },\n        { country: 'Denmark', n: 29, pct: 9.4, color: '#16161d' },\n        { country: 'Netherlands', n: 25, pct: 8.1, color: '#16161d' },\n        { country: 'Belgium', n: 23, pct: 7.5, color: '#16161d' },\n        { country: 'Switzerland', n: 23, pct: 7.5, color: '#16161d' },\n        { country: 'Sweden', n: 20, pct: 6.5, color: '#16161d' },\n      ],\n      pubTypes: [\n        { label: 'Journal articles', n: 362, color: red },\n        { label: 'Conference papers', n: 67, color: blue },\n        { label: 'Preprints', n: 38, color: gold },\n        { label: 'Book chapters', n: 32, color: green },\n        { label: 'Editorials', n: 8, color: '#c9c6bd' },\n        { label: 'Books', n: 2, color: '#6b6861' },\n      ],\n      pd0: pdSeg(362, red, 0),\n      pd1: pdSeg(67, blue, 362),\n      pd2: pdSeg(38, gold, 429),\n      pd3: pdSeg(32, green, 467),\n      pd4: pdSeg(8, '#c9c6bd', 499),\n      consortia: [\n        { name: 'i-DREAMS', budget: '€6.3M', pct: 100 },\n        { name: 'Drive2theFuture', budget: '€4.0M', pct: 63 },\n        { name: 'MOMENTUM', budget: '€2.9M', pct: 46 },\n      ],\n      euProjects: ['NOESIS', 'HumAV', 'i-DREAMS', 'MOMENTUM', 'Drive2theFuture', 'PHOEBE', 'MI-TRAP', 'AUTOSUP', 'CulturalRoad', 'SCUDO'],\n      nationalProjects: ['D-Vanpool', 'TraMPA', 'VOTAVI', 'SEE-FAr', 'i-TRAUM', 'PANAMERA'],\n      fundStats: [\n        { v: '€4M+', label: 'Third-party funding, last 5 years', color: red },\n        { v: '33', label: 'Funded projects at TUM since 2017', color: '#16161d' },\n        { v: '€3.0M', label: 'TUM share of active funding', color: '#16161d' },\n      ],\n      editorial: [\n        { k: 'Editor-in-Chief', v: 'Co-EiC, Transportation Research Part A — with Anming Zhang, since 2025' },\n        { k: 'Editorial boards', v: 'TR Part C · Accident Analysis & Prevention · Communications in Transportation Research' },\n        { k: 'Past roles', v: 'Deputy EiC, IET ITS · AE, Transportation Letters · Editor, EURO J. Transportation & Logistics' },\n        { k: 'Peer review', v: '100+ scientific committees served · reviewer for 50+ journals' },\n      ],\n      supervision: [\n        { k: 'Doctorates', v: '15+ completed · 20+ in progress · 100+ theses supervised' },\n        { k: 'Programme directorships', v: 'MS Transportation Systems (TUM) · MS Rail Transport & Logistics (TUM Asia, Singapore)' },\n        { k: 'Conferences organised', v: 'hEART 2018 · mobil.TUM 2019 · IEEE MT-ITS 2021 · hEART 2025 · ISTTT26 2026' },\n        { k: 'Alumni placements', v: 'Ten now hold faculty posts — UCL, Imperial, DTU, Twente, USC, Sun Yat-sen & more; others at the World Bank, Amazon & Traton' },\n      ],\n    };\n  }\n\n  componentWillUnmount() {\n    if (this._netRaf) cancelAnimationFrame(this._netRaf);\n  }\n\n  componentDidMount() {\n    const root = this.el || document;\n    const motion = this.props.motion ?? true;\n    const accent = this.props.accent;\n\n    if (accent) {\n      root.querySelectorAll('[data-accent-fg]').forEach(e => { e.style.color = accent; });\n    }\n\n    // reveals\n    const reveals = Array.from(root.querySelectorAll('[data-reveal]'));\n    reveals.forEach(el => {\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(22px)';\n      el.style.transition = 'opacity .8s cubic-bezier(.2,.7,.2,1), transform .8s cubic-bezier(.2,.7,.2,1)';\n    });\n    const rio = new IntersectionObserver((ents) => {\n      ents.forEach(e => { if (e.isIntersecting) { e.target.style.opacity = '1'; e.target.style.transform = 'none'; rio.unobserve(e.target); } });\n    }, { threshold: 0.1, rootMargin: '0px 0px -6% 0px' });\n    reveals.forEach(el => rio.observe(el));\n\n    // ===== research network — gentle float + interactive highlight / pin =====\n    const svg = root.querySelector('[data-net-svg]');\n    if (svg) {\n      const adj = this.renderVals()._adj || {};\n      const nodeGs = Array.from(svg.querySelectorAll('[data-node]'));\n      const edgeLs = Array.from(svg.querySelectorAll('[data-edge]'));\n      const netMotion = motion;\n      const accentC = () => this.props.accent || '#3070B3';\n      const M = {};\n      nodeGs.forEach(g => {\n        const id = g.getAttribute('data-node');\n        M[id] = { g, bx: +g.getAttribute('data-bx'), by: +g.getAttribute('data-by'),\n          phase: Math.random() * Math.PI * 2, speed: 0.4 + Math.random() * 0.35,\n          amp: id === 'hub' ? 2.5 : 5 + Math.random() * 4, ox: 0, oy: 0,\n          circle: g.querySelector('[data-circle]'), halo: g.querySelector('[data-halo]'), label: g.querySelector('[data-label]') };\n      });\n      const setEdge = (e) => {\n        const [a, b] = e.getAttribute('data-edge').split('|');\n        const p = M[a], q = M[b];\n        e.setAttribute('x1', (p.bx + p.ox).toFixed(1)); e.setAttribute('y1', (p.by + p.oy).toFixed(1));\n        e.setAttribute('x2', (q.bx + q.ox).toFixed(1)); e.setAttribute('y2', (q.by + q.oy).toFixed(1));\n      };\n      let hoverId = null, pinId = null, dash = 0;\n      const apply = () => {\n        const id = hoverId || pinId;\n        if (!id) {\n          nodeGs.forEach(g => {\n            const m = M[g.getAttribute('data-node')];\n            g.style.opacity = '1';\n            if (m.circle) m.circle.style.transform = 'scale(1)';\n            if (m.halo && g.getAttribute('data-node') !== 'hub') m.halo.style.opacity = '0';\n            if (m.label) m.label.style.fill = '#e9e6de';\n          });\n          edgeLs.forEach(e => { e.style.stroke = 'rgba(245,243,238,0.16)'; e.style.strokeWidth = '1.4'; e.style.strokeDasharray = 'none'; });\n          return;\n        }\n        const near = adj[id] || new Set();\n        nodeGs.forEach(g => {\n          const mid = g.getAttribute('data-node'), m = M[mid];\n          const on = mid === id || near.has(mid);\n          g.style.opacity = on ? '1' : '0.18';\n          if (m.circle) m.circle.style.transform = mid === id ? 'scale(1.16)' : 'scale(1)';\n          if (m.halo && mid !== 'hub') m.halo.style.opacity = mid === id ? '0.55' : '0';\n          if (m.label) m.label.style.fill = mid === id ? '#f5f3ee' : '#e9e6de';\n        });\n        edgeLs.forEach(e => {\n          const [a, b] = e.getAttribute('data-edge').split('|');\n          const on = a === id || b === id;\n          e.style.stroke = on ? accentC() : 'rgba(245,243,238,0.05)';\n          e.style.strokeWidth = on ? '2.6' : '1';\n          e.style.strokeDasharray = on ? '7 7' : 'none';\n        });\n      };\n      nodeGs.forEach(g => {\n        const id = g.getAttribute('data-node');\n        g.addEventListener('mouseenter', () => { hoverId = id; apply(); });\n        g.addEventListener('mouseleave', () => { hoverId = null; apply(); });\n        g.addEventListener('click', (ev) => { ev.stopPropagation(); pinId = pinId === id ? null : id; apply(); });\n      });\n      svg.addEventListener('click', () => { pinId = null; hoverId = null; apply(); });\n      const t0 = performance.now();\n      const frame = (now) => {\n        const t = (now - t0) / 1000;\n        for (const id in M) {\n          const m = M[id];\n          m.ox = Math.cos(t * m.speed + m.phase) * m.amp;\n          m.oy = Math.sin(t * m.speed * 0.85 + m.phase) * m.amp;\n          m.g.style.transform = 'translate(' + m.ox.toFixed(2) + 'px,' + m.oy.toFixed(2) + 'px)';\n        }\n        edgeLs.forEach(setEdge);\n        const hid = hoverId || pinId;\n        if (hid) { dash -= 0.7; edgeLs.forEach(e => { const [a, b] = e.getAttribute('data-edge').split('|'); if (a === hid || b === hid) e.style.strokeDashoffset = dash.toFixed(1); }); }\n        this._netRaf = requestAnimationFrame(frame);\n      };\n      if (netMotion) this._netRaf = requestAnimationFrame(frame);\n      else edgeLs.forEach(setEdge);\n      apply();\n    }\n\n    // count-up (with optional comma formatting)\n    const fmt = (v, comma) => comma ? v.toLocaleString('en-US') : String(v);\n    const countTo = (el) => {\n      const target = parseFloat(el.getAttribute('data-count')) || 0;\n      const suffix = el.getAttribute('data-suffix') || '';\n      const comma = !!el.getAttribute('data-comma');\n      if (!motion) { el.textContent = fmt(target, comma) + suffix; return; }\n      const dur = 1300, start = performance.now();\n      const tick = (now) => {\n        const p = Math.min(1, (now - start) / dur);\n        const v = Math.round(target * (1 - Math.pow(1 - p, 3)));\n        el.textContent = fmt(v, comma) + suffix;\n        if (p < 1) requestAnimationFrame(tick); else el.textContent = fmt(target, comma) + suffix;\n      };\n      requestAnimationFrame(tick);\n    };\n\n    const anim = new IntersectionObserver((ents) => {\n      ents.forEach(e => {\n        if (!e.isIntersecting) return;\n        const el = e.target;\n        anim.unobserve(el);\n        if (el.hasAttribute('data-count')) countTo(el);\n        if (el.hasAttribute('data-bar-fill')) { if (!motion) el.style.transition = 'none'; el.style.width = el.getAttribute('data-pct') + '%'; }\n        if (el.hasAttribute('data-barv')) { if (!motion) el.style.transition = 'none'; el.style.height = el.getAttribute('data-pct') + '%'; }\n      });\n    }, { threshold: 0.3 });\n    root.querySelectorAll('[data-count],[data-bar-fill],[data-barv]').forEach(el => anim.observe(el));\n  }\n}\n<\/script>\n\n\n<\/body><\/html>"</script>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#f5f3ee;color:#16161d;font-family:'Space Grotesk',system-ui,sans-serif;overflow:hidden;}
  #wrap{position:relative;width:100%;height:100%;}
  svg{width:100%;height:100%;display:block;}
  .country{stroke:#f5f3ee;stroke-width:0.6;transition:opacity .2s;}
  #tip{position:absolute;pointer-events:none;opacity:0;background:#16161d;color:#f5f3ee;padding:8px 11px;font-size:13px;line-height:1.3;transform:translate(-50%,-130%);white-space:nowrap;z-index:5;}
  #tip b{font-weight:600;}
  #tip .c{font-family:'Space Mono',monospace;font-weight:700;color:#8fc0ea;}
</style>
</head>
<body>
<div id="wrap"><div id="tip"></div></div>
<script>
const DATA = {
  276:{name:'Germany',n:308}, 300:{name:'Greece',n:163}, 840:{name:'United States',n:74},
  826:{name:'United Kingdom',n:50}, 156:{name:'China',n:29}, 208:{name:'Denmark',n:29},
  528:{name:'Netherlands',n:25}, 56:{name:'Belgium',n:23}, 756:{name:'Switzerland',n:23},
  752:{name:'Sweden',n:20}, 152:{name:'Chile',n:15}, 702:{name:'Singapore',n:15},
  356:{name:'India',n:13}, 36:{name:'Australia',n:10}
};
const W=1000, H=540;
const svg = d3.select('#wrap').append('svg').attr('viewBox','0 0 '+W+' '+H).attr('preserveAspectRatio','xMidYMid meet');
const g = svg.append('g');
const tip = document.getElementById('tip');
const wrap = document.getElementById('wrap');
const maxN = 308;
const scale = d3.scaleSqrt().domain([0,maxN]).range([0,1]);
const ramp = d3.interpolateRgb('#d4e4f2','#3070B3');
const fillFor = (id) => { const d = DATA[+id]; return d ? ramp(0.15 + scale(d.n)*0.85) : '#e2ded3'; };

d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(topo => {
  const countries = topojson.feature(topo, topo.objects.countries).features.filter(f => f.properties.name !== 'Antarctica');
  const projection = d3.geoNaturalEarth1().fitSize([W, H-70], {type:'FeatureCollection', features:countries});
  const path = d3.geoPath(projection);
  g.selectAll('path').data(countries).enter().append('path')
    .attr('class','country').attr('d',path)
    .attr('fill', d => fillFor(d.id))
    .on('mousemove', function(ev,d){
      const rec = DATA[+d.id];
      if(!rec){ tip.style.opacity=0; return; }
      const r = wrap.getBoundingClientRect();
      tip.style.left = (ev.clientX - r.left) + 'px';
      tip.style.top = (ev.clientY - r.top) + 'px';
      tip.style.opacity = 1;
      tip.innerHTML = '<b>'+rec.name+'</b> · <span class="c">'+rec.n+'</span> works';
      g.selectAll('path').style('opacity', x => (+x.id===+d.id)?1:0.5);
    })
    .on('mouseleave', function(){ tip.style.opacity=0; g.selectAll('path').style('opacity',1); });

  // legend
  const lx=40, ly=H-34, lw=200, lh=10;
  const defs = svg.append('defs');
  const lg = defs.append('linearGradient').attr('id','lg');
  d3.range(0,1.01,0.1).forEach(t => lg.append('stop').attr('offset',(t*100)+'%').attr('stop-color',ramp(0.15+t*0.85)));
  const lgG = svg.append('g');
  lgG.append('rect').attr('x',lx).attr('y',ly).attr('width',lw).attr('height',lh).attr('fill','url(#lg)');
  [[0,'1'],[0.5,'80'],[1,'308']].forEach(([t,lab])=>{
    lgG.append('text').attr('x',lx+t*lw).attr('y',ly-7).attr('text-anchor','middle')
      .attr('fill','#8a877f').style('font-family',"'Space Mono',monospace").style('font-size','11px').text(lab);
  });
  lgG.append('text').attr('x',lx).attr('y',ly+24).attr('fill','#8a877f')
    .style('font-family',"'Space Mono',monospace").style('font-size','11px').style('letter-spacing','0.08em').text('WORKS PER PARTNER COUNTRY');
});
</script>
</body>
</html>
